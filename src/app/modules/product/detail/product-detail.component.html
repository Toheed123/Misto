<div @rightSlider>

    <!-- BACKDROP -->
    <div class="backdrop" (click)="back()"></div>

    <!-- SLIDER -->
    <div class="slider main-container">

        <div fxFlex="100%"
             fxLayout="row wrap"
             fxLayoutAlign="space-around start">

            <form fxFlex="90"
                  [formGroup]="form"
                  fxLayout="row wrap"
                  fxLayoutAlign="start start"
                  fxLayoutGap="10px grid">

                <!-- ===================================== -->
                <!-- IMAGE PREVIEW -->
                <!-- ===================================== -->

                <div fxFlex="100%"
                     fxLayout="row"
                     fxLayoutAlign="center center"
                     class="mb-20">

                    <div class="product-image-preview">

                        <img [src]="formControls.ImageUrl.value || 'assets/image/no-image.png'"
                             alt="product-image">

                    </div>

                </div>

                <!-- ===================================== -->
                <!-- PRODUCT ID -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Product Id</mat-label>

                    <input matInput formControlName="ProductId">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- PRODUCT NAME -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Product Name</mat-label>

                    <input matInput formControlName="ProductName">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- CATEGORY -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Category</mat-label>

                    <input matInput formControlName="Category">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- SIZE -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Size</mat-label>

                    <input matInput formControlName="Size">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- COLOR -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Color</mat-label>

                    <input matInput formControlName="Color">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- QUANTITY -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Quantity</mat-label>

                    <input matInput
                           type="number"
                           formControlName="Quantity">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- SELLING PRICE -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Selling Price</mat-label>

                    <input matInput
                           type="number"
                           formControlName="SellingPrice">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- DEALER NAME -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="50%">

                    <mat-label>Dealer Name</mat-label>

                    <input matInput formControlName="DealerName">

                </mat-form-field>

                <!-- ===================================== -->
                <!-- IMAGE URL -->
                <!-- ===================================== -->

                <mat-form-field fxFlex="100%">

                    <mat-label>Image Url</mat-label>

                    <textarea matInput
                              rows="3"
                              formControlName="ImageUrl">
                    </textarea>

                </mat-form-field>

                <!-- ===================================== -->
                <!-- BUTTONS -->
                <!-- ===================================== -->

                <div fxFlex="100%"
                     fxLayout="row"
                     fxLayoutAlign="end center"
                     fxLayoutGap="10px">

                    <button mat-stroked-button
                            color="primary"
                            type="button"
                            (click)="back()">

                        Cancel

                    </button>

                    <button mat-flat-button
                            color="primary"
                            type="button"
                            [disabled]="form.invalid"
                            (click)="onSubmit()">

                        Submit

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
