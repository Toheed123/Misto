<div @rightSlider>
    <div class="backdrop" (click)="back()"></div>
    <div class="slider main-container">

        <div fxFlex="100%" fxLayout="row wrap" fxLayoutAlign="space-around start">
            <form fxFlex="80" [formGroup]="form" fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="10px grid">

                <mat-form-field fxFlex="50%">
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="Date">
                    <mat-hint>DD/MM/YYYY</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field fxFlex="50%">
                    <mat-label>Expense Type</mat-label>
                    <mat-select formControlName="ExepenceType">
                        @for (type of ExepenceType(); track type) {
                        <mat-option [value]="type.Value">{{type.Name}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field fxFlex="50%">
                    <mat-label>Amount</mat-label>
                    <input matInput type="number" formControlName="Amount">
                </mat-form-field>

                <mat-form-field fxFlex="50%">
                    <mat-label>Payment Method</mat-label>
                    <mat-select formControlName="PaymentMethod">
                        @for (method of paymentMethods(); track method) {
                        <mat-option [value]="method.Value">{{method.Name}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field fxFlex="100%">
                    <mat-label>Transaction ID</mat-label>
                    <input matInput type="text" formControlName="TransactionId">
                </mat-form-field>

                <mat-form-field fxFlex="100%">
                    <mat-label>Description</mat-label>
                    <textarea matInput formControlName="Description"></textarea>
                </mat-form-field>

                <div fxFlex="100%" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
                    <button mat-stroked-button color="primary" (click)="back()">Cancel</button>
                    <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="onSubmit()">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
<p>expences-add works!</p>
