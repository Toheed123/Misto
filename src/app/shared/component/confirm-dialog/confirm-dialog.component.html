<h2 mat-dialog-title>
  {{ data.title || 'Confirm' }}
</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onNo()">
    No
  </button>

  <button mat-raised-button color="warn" (click)="onYes()">
    Yes
  </button>
</mat-dialog-actions>
