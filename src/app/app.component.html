@if ((authenticationService.getAuthResult)) {

<mat-drawer-container class="layout-container">

  <!-- SIDEBAR -->
  <mat-drawer
    #drawer
    mode="side"
    class="sidenave-container"
    
    opened="true">

    <app-sidemenu></app-sidemenu>

  </mat-drawer>

  <!-- MAIN CONTENT -->
  <div class="content-wrapper">

    <!-- TOPBAR -->
    <mat-toolbar class="title-toolbar" color="primary">

      <div class="toolbar-left">

        <button
          mat-icon-button
          class="menu-btn"
          (click)="drawer.toggle()">

          <mat-icon>menu</mat-icon>

        </button>

        <div class="breadcrumb-container">

          <span class="main-title">
            {{ title }}
          </span>

          @if (name) {

            <div class="breadcrumb">

              <mat-icon>
                chevron_right
              </mat-icon>

              <span class="subtitle">
                {{ name }}
              </span>

            </div>

          }

        </div>

      </div>

      <!-- RIGHT SECTION -->
      <div class="toolbar-right">

        <button mat-icon-button class="topbar-icon">
          <mat-icon>notifications</mat-icon>
        </button>

        <button mat-icon-button class="topbar-icon">
          <mat-icon>dark_mode</mat-icon>
        </button>

        <div class="profile-mini" [matMenuTriggerFor]="menu" title="more">

          <img
            src="../../../assets/LOGO_3.jpg"
            alt="profile">

        </div>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="navigate('my-account')">
            <mat-icon>account_circle</mat-icon>
            <span>My Profile</span>
          </button>
          <button mat-menu-item (click)="navigate('my-account')">
            <mat-icon>lock_reset</mat-icon>
            <span>Change Password</span>
          </button>
          <button mat-menu-item (click)="logOut()">
            <mat-icon>logout</mat-icon>
            <span>LogOut</span>
          </button>
        </mat-menu>

      </div>

    </mat-toolbar>

    <!-- PAGE CONTENT -->
    <div class="page-container">

      @if ((authenticationService.getAuthResult)) {
        <router-outlet></router-outlet>
      }

    </div>

    <app-notification></app-notification>

    @if(appService.isLoading$ | async){

      <div class="spinner-container">
        <mat-spinner diameter="70"></mat-spinner>
      </div>

    }

  </div>

</mat-drawer-container>

}

@if (!(authenticationService.getAuthResult)) {
  <router-outlet></router-outlet>
}
